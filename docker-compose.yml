services:
  postgres:
    image: postgres:17
    ports:
      # Loopback only: the credentials below are well known.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cocktail_party
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cocktail_party']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
