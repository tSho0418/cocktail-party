name: Deploy

# CD for main: full CI including e2e, then migrate the Neon database and deploy to Vercel.
# Required in the `production` environment: DATABASE_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# App runtime env vars (BETTER_AUTH_*, GOOGLE_*, LINE_*, R2_*) live in the Vercel project.
# Disabled for now (CD postponed): runs only when started by hand from the Actions tab.
# To enable, restore `push: branches: [main]` here.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy midway: a half-applied migration is worse than a queued run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations run before the new code goes live, so they must stay backward compatible
      # with the previous deployment (expand, then contract in a later release).
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
